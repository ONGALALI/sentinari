<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinari Admin Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f2f5f8; color: #17212b; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #d4dbe3; border-radius: 10px; padding: 22px; }
    h1 { margin: 0 0 10px 0; font-size: 24px; }
    p { margin: 0 0 14px 0; color: #4a5d73; font-size: 14px; }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #c3ccd6; border-radius: 6px; font-size: 14px; }
    button { width: 100%; margin-top: 14px; padding: 10px 12px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font-weight: 700; cursor: pointer; }
    .msg { margin-top: 10px; min-height: 20px; font-size: 13px; }
    .err { color: #a72222; }
    .ok { color: #1a7a3b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Sentinari Admin Login</h1>
      <p>Use your Sentinari single-login credentials to access the admin console.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="smi">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">

      <button id="btnLogin" type="button">Sign In</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    const nextPath = "__NEXT_PATH__";
    const msg = document.getElementById("msg");
    const userInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const btn = document.getElementById("btnLogin");

    const setMsg = (text, ok) => {
      msg.textContent = text || "";
      msg.className = "msg " + (ok ? "ok" : "err");
    };

    const submitLogin = async () => {
      const username = String(userInput.value || "").trim();
      const password = String(passwordInput.value || "");
      if (!username || !password) {
        setMsg("Username and password are required.", false);
        return;
      }
      btn.disabled = true;
      setMsg("Signing in...", true);
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          throw new Error(String(data.detail || data.error || "Login failed."));
        }
        setMsg("Login successful. Redirecting...", true);
        window.location.assign(nextPath || "/ui/admin");
      } catch (error) {
        setMsg(String(error && error.message ? error.message : error), false);
      } finally {
        btn.disabled = false;
      }
    };

    btn.addEventListener("click", submitLogin);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitLogin();
    });

    (async () => {
      try {
        const res = await fetch("/api/admin/login-status");
        const data = await res.json();
        if (res.ok && data && data.ok && data.enabled && data.username) {
          userInput.value = String(data.username);
        }
      } catch {
        // Ignore non-critical status load errors.
      }
    })();
  </script>
</body>
</html>
