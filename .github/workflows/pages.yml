:root {
  --bg-deep: #0b0f19;
  --bg-surface: #111827;
  --bg-card: rgba(17, 24, 39, 0.72);
  --border: rgba(255, 255, 255, 0.08);
  --border-bright: rgba(99, 102, 241, 0.32);
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --accent: #10b981;
  --cyan: #06b6d4;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: "Plus Jakarta Sans", sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.container {
  width: min(1200px, calc(100% - 32px));
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.45;
  pointer-events: none;
  z-index: 0;
}
.glow-one {
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 450px;
  background: rgba(99, 102, 241, 0.18);
}
.glow-two {
  right: -100px;
  top: 600px;
  width: 500px;
  height: 400px;
  background: rgba(6, 182, 212, 0.12);
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  background: rgba(11, 15, 25, 0.75);
  border-bottom: 1px solid var(--border);
}

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.04em;
}
.brand-badge {
  font-size: 0.68rem;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.4);
  color: #a5b4fc;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.nav {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}
.nav a {
  color: var(--text-muted);
  font-size: 0.92rem;
  font-weight: 500;
  transition: color 0.2s ease;
}
.nav a:hover {
  color: var(--text-main);
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0.8rem 1.3rem;
  font-weight: 700;
  font-size: 0.92rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.button:hover {
  transform: translateY(-1px);
}
.button-primary {
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: #fff;
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.38);
}
.button-secondary {
  background: rgba(255, 255, 255, 0.04);
  color: #edf2ff;
  border-color: var(--border);
}
.nav-cta { padding-inline: 1rem; }

.hero {
  text-align: center;
  padding: 96px 0 56px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(16, 185, 129, 0.32);
  background: rgba(16, 185, 129, 0.08);
  color: #34d399;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
}
.dot.blue { background: #818cf8; box-shadow: 0 0 12px rgba(129, 140, 248, 0.8); }

.hero h1 {
  margin: 24px auto 20px;
  max-width: 940px;
  font-size: clamp(2.8rem, 6vw, 5rem);
  line-height: 1.08;
  letter-spacing: -0.06em;
  font-weight: 800;
  background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero h1 span {
  display: inline-block;
  background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lead {
  max-width: 760px;
  margin: 0 auto;
  color: var(--text-muted);
  font-size: 1.15rem;
  line-height: 1.75;
}
.hero-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 30px;
}

.telemetry {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 18px;
  margin-bottom: 80px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px 22px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
}
.stat-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.stat-value {
  margin-top: 16px;
  font-size: clamp(2rem, 3vw, 2.6rem);
  font-weight: 800;
  font-family: "JetBrains Mono", monospace;
  letter-spacing: -0.04em;
}
.stat-sub {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 0.82rem;
  line-height: 1.5;
}

.section-block {
  padding: 50px 0;
}
.section-heading {
  max-width: 700px;
  margin: 0 auto 30px;
  text-align: center;
}
.section-heading h2 {
  margin: 0 0 12px;
  font-size: clamp(2rem, 3vw, 2.6rem);
  letter-spacing: -0.04em;
}
.section-heading p {
  color: var(--text-muted);
  margin: 0;
  line-height: 1.7;
}
.section-heading.smaller {
  max-width: 620px;
}
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(99, 102, 241, 0.12);
  border: 1px solid rgba(99, 102, 241, 0.38);
  color: #a5b4fc;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.pill.sub {
  margin-bottom: 12px;
}
.pill.alt {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.3);
  color: #6ee7b7;
}

.reports-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
}
.report-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(17, 24, 39, 0.9));
  border: 1px solid rgba(99, 102, 241, 0.28);
  border-radius: 18px;
  padding: 28px;
}
.report-card.accent-cyan {
  border-color: rgba(6, 182, 212, 0.35);
}
.report-card.accent-green {
  border-color: rgba(16, 185, 129, 0.35);
}
.report-badge {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(99, 102, 241, 0.12);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.35);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  font-weight: 700;
  text-transform: uppercase;
}
.report-card h3 {
  margin: 18px 0 10px;
  font-size: 1.55rem;
  letter-spacing: -0.03em;
}
.report-sub {
  color: #38bdf8;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.report-card p {
  margin: 0 0 14px;
  color: var(--text-muted);
  line-height: 1.7;
}
.report-card ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
  color: #dfe7f3;
  font-size: 0.9rem;
}
.report-card li {
  line-height: 1.6;
}
.report-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

.panel {
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid rgba(99, 102, 241, 0.35);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.panel-head h3 {
  margin: 0;
  font-size: clamp(1.4rem, 2vw, 2rem);
  letter-spacing: -0.04em;
}
.blueprint-image {
  width: 100%;
  height: auto;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: #050b14;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
}
.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: 16px;
  padding: 26px 24px;
}
.feature-icon {
  width: 52px;
  height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 1.5rem;
  background: rgba(99, 102, 241, 0.12);
  border: 1px solid rgba(99, 102, 241, 0.24);
  margin-bottom: 18px;
}
.feature-card h3 {
  margin: 0 0 10px;
  font-size: 1.2rem;
}
.feature-card p {
  margin: 0;
  color: var(--text-muted);
  line-height: 1.7;
}

.bottom-cta {
  padding-bottom: 80px;
}
.repo-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 26px 28px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(16, 185, 129, 0.06));
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 18px;
  flex-wrap: wrap;
}
.repo-card h3 {
  margin: 12px 0 8px;
  font-size: clamp(1.3rem, 2vw, 1.9rem);
  letter-spacing: -0.04em;
}
.repo-card p {
  margin: 0;
  color: var(--text-muted);
  max-width: 700px;
  line-height: 1.7;
}
.repo-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.site-footer {
  border-top: 1px solid var(--border);
  background: rgba(11, 15, 25, 0.95);
}
.footer-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 80px;
  color: var(--text-muted);
  font-size: 0.9rem;
  flex-wrap: wrap;
}
.footer-wrap a {
  color: #dbeafe;
}

@media (max-width: 840px) {
  .nav-wrap {
    flex-direction: column;
    justify-content: center;
    padding: 18px 0;
  }
  .nav {
    justify-content: center;
  }
  .hero {
    padding-top: 72px;
  }
}

@media (max-width: 560px) {
  .button,
  .nav-cta {
    width: 100%;
  }
  .hero-actions,
  .report-actions,
  .repo-actions {
    flex-direction: column;
  }
  .panel-head,
  .repo-card {
    align-items: flex-start;
  }
}
