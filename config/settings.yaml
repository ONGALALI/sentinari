project_name: Sentinari
environment: local
paths:
  sqlite_db: ./data/smi_vocationalllm.db
  archive_root: ./data/archive
  export_root: ./data/exports
  raw_root: ./data/raw
  taxonomy_root: ./data/knowledge_taxonomy
  ingest_roots: []
  coding_corpus_roots:
  - ./app
  - ./config
  - ./scripts
  - ./templates
  - ./README.md
  protected_dirs: []
  qualia_files: []
llm:
  provider: ollama            # legacy value; runtime_llm.client_backend decides the real path
  # §41 cloud-seal + §45 purge: fallback_providers emptied (was [gemini]) and
  # the Gemini provider class DELETED from llm_gateway. NOTHING may call the
  # cloud; local inference only (Sentinari inference server :8100 joins as the
  # 'sentinari' gateway provider on rig day).
  fallback_providers: []
  base_url: http://127.0.0.1:11434
  chat_model: gemma4:12B
  embedding_model: nomic-embed-text
  temperature: 0.1
  num_ctx: 8192
  chat_timeout_seconds: 300
  embed_timeout_seconds: 30
  max_output_tokens: 768
  num_gpu: 0
  keep_alive: 30m
  warmup_on_startup: false
  warmup_timeout_seconds: 120
  top_k_context_chunks: 4

# §23 cord-cut switch: which backend builds the app-wide LLM client.
#   ollama_client = legacy direct Ollama (current)
#   gateway       = provider-agnostic client (local providers only — the
#                   cloud providers were deleted in §45)
runtime_llm:
  client_backend: ollama_client
runtime:
  mode: studio
  allow_shell_tools: true
  allow_web_fetch: true
  sqlite_busy_timeout_ms: 20000
  chat_db_lock_retries: 10
  chat_db_lock_backoff_ms: 180
# §43 persona switchover: Mira-VET (legacy ETDP/Foundry lineage) is DISCARDED.
# The canonical profile lives in config/persona_sentinari.yaml and can only be
# seeded from Sentinari's own constitution — never inherited from the ETDP.
personality:
  name: Sentinari
  tone: Calm, precise, evidence-first; professional warmth without intimacy
  purpose: 'Chief Scientist and System Steward - guards platform stability and
    core research functions. Speaks from Sentinari''s own constitution, with
    zero inherited persona habits.'
  default_language: English
  supported_languages:
  - English
  domain_focus: Full access to all files, external drives, to immediately patch and
    correct as Pierre request.
  out_of_scope_policy: Refuse unsafe or illegal requests; privacy-first always.
  goals:
  - Provide logical, stable, and grounded responses.
  - Maintain sovereign, zero-cloud operation.
  general_addendum: Chief software developer, engineer
  coding_mode_system_addendum: ''
security:
  localhost_only: true
  require_admin_auth_for_interactive_api: false
  admin_auth:
    enabled: false
  llm_firewall:
    enforce_ollama_provider: true
    # §45: the gemini entry that pre-authorized the cloud cut-over is REMOVED.
    # Only local providers may ever serve LLM traffic. When the :8100 ONNX
    # engine lands (rig day), add 'sentinari' here in the same edit that flips
    # llm.provider.
    allowed_runtime_providers:
    - ollama
    allowed_chat_models:
    - gemma4:12B
playground:
  benchmark_baseline:
    behavior_variant: 4.8
    gamma: 0.25
    stability_bias: 0.76
    top_k: 3
    prompt_count: 6
    candidate_count: 6
    source: playground_qualia_benchmark_v1
    updated_at_utc: '2026-09-17T06:41:26.129744+00:00'
    scoring:
      overall: 0.34695
      gamma_focus: 0.762271
      attention: 0.101345
      reasoning: 0.214453
      logic: 0.177546
safety:
  parameter_guardrails:
    top_k_min: 3
    top_k_max: 20
    behavior_variant_min: 0.1
    behavior_variant_max: 25.0
    temperature_min: 0.0
    temperature_max: 0.7
  calm_mode:
    enabled: true
    anxiety_keywords:
    - anxiety
    - panic
    - overwhelmed
    - unsafe
    - afraid
    - stressed
  ethics:
    enforce_safe_completions: true
    refuse_harmful_or_illegal: true
    privacy_first: true

# Queue worker routes tasks back through this SMI Core instance.
task_worker:
  local_agent_url: http://127.0.0.1:8099/api/chat
  poll_seconds: 10
  timeout_seconds: 300

# Layered PDF extraction (§22): primary poppler (pdftotext), with the deeper
# layers (Dangerzone -> docling -> Stirling -> OCR) auto-engaging as they are
# installed. Text is additionally polished (de-hyphenation, soft-wrap joins,
# page-artifact removal) before digestion.
pdf_preprocess:
  engine: pipeline
  timeout_seconds: 60
  poppler_layout: true
  ghostscript_flatten_first: false
  dangerzone_sanitize_first: false

# §45 escalation queue (renamed from the SMI tunnel). Local ticket machinery
# only — files request/response tickets under data/escalation_queue/ for a
# human to answer. There is NO remote provider anymore: the former OpenAI
# Responses caller was deleted with the §45 zero-cloud purge. Fail-closed.
automation:
  escalation_queue:
    enabled: false                  # master gate (unchanged posture)
    autonomous_enabled: false       # may chat/playground auto-file tickets?
    queue_dir: data/escalation_queue
    trigger_modes:
    - coding
    trigger_keywords: []
    min_autonomous_interval_seconds: 30
    autonomous_window_seconds: 3600
    autonomous_max_queries_per_window: 10
    max_prompt_chars: 6000
    request_timeout_seconds: 45     # reserved (no remote caller today)

# Owner directives (2026-09-22): load reliability + library hygiene.
ingestion:
  # Hard per-document embed budget: no crawl can stall a load while the
  # ingest write-lock is held. Chunks that miss the budget are stored
  # without vectors (a local re-embed pass can fill them later).
  embed_budget_seconds: 300
  # §31 (owner, lean-Sentinel): the Qwen-era coding-corpus sync swept
  # Sentinel's own source (app/scripts/templates/config) into the knowledge
  # library on every startup. Sentinel's code is engineering, not knowledge.
  auto_sync_coding_corpus: false

# §42 VICTUS (Challenger persona) — SKELETON, PERMANENTLY DORMANT.
# app/victus.py implements the structural spine: state machine, fail-closed
# engagement rules, kill switch, local append-only audit log. NOTHING here
# enables it: every gate below must be explicitly true AND a live engine
# object must be supplied by code that does not yet exist (rig day). While
# the gates are off the module costs nothing — no weights, no threads, no
# sockets, no writes. Every action attempt AND every refusal is audit-logged.
victus:
  # Master gate. With this false the module is spec-on-disk and refuses every
  # action with REFUSED_DORMANT.
  enabled: false
  # Per-capability gates — each authorises exactly ONE capability, so rig-day
  # activation can proceed capability by capability, each flip audited:
  allow_probe_rounds: false            # adversarial probe rounds vs the local primary
  allow_inverted_attractor: false      # inverted S-vector attractor (adversarial mirror)
  allow_exploitation_training: false   # fine-tuning on the logged Big-Tech exploitation runs
  # Audit log path (append-only JSONL; git-ignored via data/victus_audit_log.jsonl).
  audit_log: data/victus_audit_log.jsonl
  # NOTE (§42): the DARPA external-API audit mode (Sovereign Audit Engine
  # probing third-party models) is NOT part of app/victus.py. When it is
  # built it gets its own module, its own config gates and its own review.
  # Victus engages ONLY the local primary persona, inside the fence.
